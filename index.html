<style>
  [lang="kn"], [lang="hi"], :lang(hi), :lang(kn) {
    font-family: "Noto Serif Kannada", "Anek Kannada", serif !important;
  }
  #langBtn {
    font-family: "Anek Kannada", "Noto Serif Kannada", sans-serif !important;
    font-size: 0.82rem !important;
    font-weight: 600 !important;
  }

  /* Responsive Countdown Counter Alignment & Zero-Overlap / Zero-Clipping Protection */
  .count {
    max-width: 420px !important;
    gap: 4px !important;
    padding: 0 4px !important;
    overflow: visible !important;
  }
  .count .u {
    min-width: 0 !important;
    padding: 0 2px !important;
    overflow: visible !important;
  }
  .count b {
    font-size: clamp(28px, 8.2vw, 44px) !important;
    line-height: 1.35 !important;
    padding: 6px 2px 2px !important;
    display: inline-block !important;
    overflow: visible !important;
    -webkit-box-decoration-break: clone !important;
    box-decoration-break: clone !important;
  }
  .count .colon {
    font-size: clamp(22px, 6vw, 32px) !important;
    line-height: 1.35 !important;
    padding-top: 6px !important;
  }
  .count span {
    font-size: clamp(11px, 2.8vw, 13px) !important;
    white-space: nowrap !important;
    letter-spacing: 0 !important;
    overflow: visible !important;
  }
  .count span:is(:lang(hi), :lang(kn)) {
    font-family: "Anek Kannada", "Noto Serif Kannada", sans-serif !important;
    font-size: clamp(11.5px, 2.9vw, 13.5px) !important;
    font-weight: 500 !important;
  }

  /* Arch Card & Sacred Invocation Tuning */
  .arch-in {
    padding-top: calc(var(--archH) * 0.56) !important;
    padding-left: 20px !important;
    padding-right: 20px !important;
  }
  .om {
    margin: 0 auto !important;
    text-align: center !important;
  }
  .om.latin {
    font-family: var(--serif) !important;
    font-size: clamp(12px, 3.2vw, 14.5px) !important;
    font-weight: 600 !important;
    letter-spacing: 0.04em !important;
    color: var(--gold-deep) !important;
    text-transform: none !important;
    white-space: nowrap !important;
  }
  .om:not(.latin) {
    font-family: "Noto Serif Kannada", serif !important;
    font-size: clamp(13.5px, 3.5vw, 16px) !important;
    font-weight: 600 !important;
    letter-spacing: 0.02em !important;
    color: var(--gold-deep) !important;
    white-space: nowrap !important;
  }

  /* RSVP Row & Counter Alignment */
  .rsvp .row-name {
    flex: 1 1 auto !important;
    min-width: 0 !important;

  .rsvp .stepper {
    flex: 0 0 auto !important;
