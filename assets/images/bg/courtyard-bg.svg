<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%" fill="none">
  <defs>
    <!-- Royal Dusk / Golden Hour Lake Pichola Sky Gradient -->
    <linearGradient id="duskSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141a38"/>
      <stop offset="30%" stop-color="#2d224d"/>
      <stop offset="55%" stop-color="#692d52"/>
      <stop offset="75%" stop-color="#b8534f"/>
      <stop offset="88%" stop-color="#e28c5a"/>
      <stop offset="100%" stop-color="#fcd385"/>
    </linearGradient>

    <!-- Glowing Mandap Chandelier / Evening Sun -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fff2b2"/>
      <stop offset="55%" stop-color="#f5a623" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#b8534f" stop-opacity="0"/>
    </radialGradient>

    <!-- Palace Marble Courtyard Arch Gradient -->
    <linearGradient id="palaceMarble" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#211024"/>
      <stop offset="50%" stop-color="#3b1a36"/>
      <stop offset="100%" stop-color="#190a17"/>
    </linearGradient>

    <!-- Water Reflection / Courtyard Stone Flooring -->
    <linearGradient id="stoneFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e28c5a" stop-opacity="0.4"/>
      <stop offset="20%" stop-color="#4a2233"/>
      <stop offset="100%" stop-color="#150812"/>
    </linearGradient>

    <!-- Gold Foil Highlights -->
    <linearGradient id="goldAccents" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8d6"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a5a00"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="600" height="900" fill="url(#duskSky)"/>

  <!-- Sun Glow on Horizon -->
  <circle cx="300" cy="460" r="160" fill="url(#sunGlow)"/>

  <!-- Distant Haveli Domes & Jharokhas Skyline -->
  <!-- Left Domes -->
  <path d="M 0 540 L 0 490 Q 40 470, 70 490 Q 90 440, 120 440 Q 150 440, 160 490 L 190 490 Q 210 460, 240 460 Q 270 460, 280 490 L 320 490 Q 330 460, 360 460 Q 390 460, 410 490 L 440 490 Q 450 440, 480 440 Q 510 440, 530 490 Q 560 470, 600 490 L 600 540 Z" fill="#2d172e" opacity="0.6"/>

  <!-- Majestic Grand Mughal Palace Archway Framing the Mandap -->
  <path d="M 0 900 L 0 0 L 600 0 L 600 900 L 510 900 L 510 420 
           C 510 320, 460 210, 390 170
           C 350 148, 320 110, 300 80
           C 280 110, 250 148, 210 170
           C 140 210, 90 320, 90 420
           L 90 900 Z" fill="url(#palaceMarble)"/>

  <!-- Inner Scalloped Filigree Border on Arch -->
  <path d="M 90 420 
           C 90 320, 140 210, 210 170
           C 250 148, 280 110, 300 80
           C 320 110, 350 148, 390 170
           C 460 210, 510 320, 510 420" stroke="url(#goldAccents)" stroke-width="2.5" fill="none" opacity="0.8"/>

  <!-- Left Palace Pillar Details -->
  <rect x="90" y="420" width="30" height="480" fill="url(#palaceMarble)" stroke="url(#goldAccents)" stroke-width="1.2" opacity="0.9"/>
  <!-- Right Palace Pillar Details -->
  <rect x="480" y="420" width="30" height="480" fill="url(#palaceMarble)" stroke="url(#goldAccents)" stroke-width="1.2" opacity="0.9"/>

  <!-- Central Wedding Mandap Pavilion Silhouette -->
  <!-- Mandap Domes & Pillars -->
  <path d="M 220 540 L 220 460 Q 300 370, 380 460 L 380 540 Z" fill="#4d1f3b" opacity="0.8"/>
  <circle cx="300" cy="370" r="14" fill="url(#goldAccents)"/>
  <!-- Kalash on Mandap top -->
  <path d="M 295 356 L 305 356 L 300 340 Z" fill="url(#goldAccents)"/>

  <!-- Mandap Pillars -->
  <line x1="230" y1="460" x2="230" y2="580" stroke="url(#goldAccents)" stroke-width="3"/>
  <line x1="260" y1="475" x2="260" y2="580" stroke="url(#goldAccents)" stroke-width="2"/>
  <line x1="340" y1="475" x2="340" y2="580" stroke="url(#goldAccents)" stroke-width="2"/>
  <line x1="370" y1="460" x2="370" y2="580" stroke="url(#goldAccents)" stroke-width="3"/>

  <!-- Sacred Agni Mandap Fire Glow in Center -->
  <ellipse cx="300" cy="565" rx="25" ry="8" fill="#ffd152"/>
  <path d="M 292 565 Q 300 535, 302 545 Q 308 530, 308 565 Z" fill="#ff5722"/>

  <!-- Courtyard Stone Floor with Water Reflective Sheen -->
  <rect x="0" y="580" width="600" height="320" fill="url(#stoneFloor)"/>

  <!-- Courtyard Decorative Floor Rangoli Outline -->
  <ellipse cx="300" cy="670" rx="140" ry="40" stroke="url(#goldAccents)" stroke-width="1.5" stroke-dasharray="3 4" fill="none" opacity="0.7"/>
  <ellipse cx="300" cy="670" rx="90" ry="25" stroke="url(#goldAccents)" stroke-width="1" fill="none" opacity="0.7"/>

  <!-- Hanging Courtyard Palace Lanterns (Fanoos) -->
  <!-- Left Lantern -->
  <line x1="180" y1="200" x2="180" y2="300" stroke="url(#goldAccents)" stroke-width="1.5"/>
  <polygon points="172,300 188,300 184,330 176,330" fill="url(#goldAccents)"/>
  <circle cx="180" cy="315" r="10" fill="#fff2b2" opacity="0.8"/>

  <!-- Right Lantern -->
  <line x1="420" y1="200" x2="420" y2="300" stroke="url(#goldAccents)" stroke-width="1.5"/>
  <polygon points="412,300 428,300 424,330 416,330" fill="url(#goldAccents)"/>
  <circle cx="420" cy="315" r="10" fill="#fff2b2" opacity="0.8"/>
</svg>
