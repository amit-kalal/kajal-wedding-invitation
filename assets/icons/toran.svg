<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Marigold Orange -->
    <radialGradient id="marigoldOrange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFAE19"/>
      <stop offset="60%" stop-color="#E65100"/>
      <stop offset="100%" stop-color="#BF360C"/>
    </radialGradient>
    <!-- Marigold Yellow -->
    <radialGradient id="marigoldYellow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="50%" stop-color="#FBC02D"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </radialGradient>
    <!-- Mango Leaf Green -->
    <linearGradient id="mangoLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="60%" stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
    <!-- Gold Beam -->
    <linearGradient id="goldBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AA771C"/>
      <stop offset="30%" stop-color="#FDF3B8"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
  </defs>

  <!-- Top Wooden/Gold Lintel -->
  <rect x="0" y="0" width="500" height="18" fill="url(#goldBeam)"/>
  <line x1="0" y1="18" x2="500" y2="18" stroke="#5D4037" stroke-width="2"/>
  <line x1="0" y1="4" x2="500" y2="4" stroke="#FFF" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Swag rope -->
  <path d="M 0 18 Q 80 50, 166 18 Q 250 50, 334 18 Q 420 50, 500 18" stroke="#8D6E63" stroke-width="2" fill="none"/>

  <!-- Mango Leaves hanging at swags -->
  <!-- Loop through leaves -->
  <g>
    <!-- Swag 1 Leaves -->
    <path d="M 40 25 C 35 45, 40 60, 42 70 C 44 60, 49 45, 44 25 Z" fill="url(#mangoLeaf)"/>
    <path d="M 83 33 C 78 55, 83 72, 85 82 C 87 72, 92 55, 87 33 Z" fill="url(#mangoLeaf)"/>
    <path d="M 125 25 C 120 45, 125 60, 127 70 C 129 60, 134 45, 129 25 Z" fill="url(#mangoLeaf)"/>

    <!-- Swag 2 Leaves -->
    <path d="M 208 25 C 203 45, 208 60, 210 70 C 212 60, 217 45, 212 25 Z" fill="url(#mangoLeaf)"/>
    <path d="M 250 33 C 245 55, 250 72, 252 82 C 254 72, 259 55, 254 33 Z" fill="url(#mangoLeaf)"/>
    <path d="M 292 25 C 287 45, 292 60, 294 70 C 296 60, 301 45, 296 25 Z" fill="url(#mangoLeaf)"/>

    <!-- Swag 3 Leaves -->
    <path d="M 375 25 C 370 45, 375 60, 377 70 C 379 60, 384 45, 379 25 Z" fill="url(#mangoLeaf)"/>
    <path d="M 417 33 C 412 55, 417 72, 419 82 C 421 72, 426 55, 421 33 Z" fill="url(#mangoLeaf)"/>
    <path d="M 459 25 C 454 45, 459 60, 461 70 C 463 60, 468 45, 463 25 Z" fill="url(#mangoLeaf)"/>
  </g>

  <!-- Marigold Flower Bundles (Genda Phool) -->
  <g>
    <!-- Drops at 0, 83, 166, 250, 334, 417, 500 -->
    <!-- Point 0 -->
    <circle cx="15" cy="22" r="9" fill="url(#marigoldOrange)"/>
    <circle cx="15" cy="38" r="8" fill="url(#marigoldYellow)"/>
    <circle cx="15" cy="52" r="7" fill="url(#marigoldOrange)"/>

    <!-- Swag 1 Center Low Point -->
    <circle cx="83" cy="38" r="9" fill="url(#marigoldYellow)"/>
    <circle cx="83" cy="52" r="8" fill="url(#marigoldOrange)"/>
    <circle cx="83" cy="65" r="7" fill="url(#marigoldYellow)"/>

    <!-- Point 166 -->
    <circle cx="166" cy="22" r="9" fill="url(#marigoldOrange)"/>
    <circle cx="166" cy="38" r="8" fill="url(#marigoldYellow)"/>
    <circle cx="166" cy="52" r="7" fill="url(#marigoldOrange)"/>
    <circle cx="166" cy="65" r="6" fill="url(#marigoldYellow)"/>

    <!-- Swag 2 Center Low Point (Middle Entrance) -->
    <circle cx="250" cy="38" r="10" fill="url(#marigoldYellow)"/>
    <circle cx="250" cy="54" r="9" fill="url(#marigoldOrange)"/>
    <circle cx="250" cy="68" r="8" fill="url(#marigoldYellow)"/>
    <circle cx="250" cy="80" r="7" fill="url(#marigoldOrange)"/>
    <!-- Little hanging brass bell at center -->
    <path d="M 247 90 L 253 90 L 255 98 L 245 98 Z" fill="#D4AF37"/>
    <circle cx="250" cy="100" r="2.5" fill="#FFE599"/>

    <!-- Point 334 -->
    <circle cx="334" cy="22" r="9" fill="url(#marigoldOrange)"/>
    <circle cx="334" cy="38" r="8" fill="url(#marigoldYellow)"/>
    <circle cx="334" cy="52" r="7" fill="url(#marigoldOrange)"/>
    <circle cx="334" cy="65" r="6" fill="url(#marigoldYellow)"/>

    <!-- Swag 3 Center Low Point -->
    <circle cx="417" cy="38" r="9" fill="url(#marigoldYellow)"/>
    <circle cx="417" cy="52" r="8" fill="url(#marigoldOrange)"/>
    <circle cx="417" cy="65" r="7" fill="url(#marigoldYellow)"/>

    <!-- Point 500 -->
    <circle cx="485" cy="22" r="9" fill="url(#marigoldOrange)"/>
    <circle cx="485" cy="38" r="8" fill="url(#marigoldYellow)"/>
    <circle cx="485" cy="52" r="7" fill="url(#marigoldOrange)"/>
  </g>
</svg>
