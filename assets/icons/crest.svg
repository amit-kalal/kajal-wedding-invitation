<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="goldCrest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4b8"/>
      <stop offset="30%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#996515"/>
      <stop offset="100%" stop-color="#f3e5ab"/>
    </linearGradient>
    <filter id="crestGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#8a5a00" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#crestGlow)">
    <!-- Outer Filigree Wreath / Circle -->
    <circle cx="150" cy="150" r="110" stroke="url(#goldCrest)" stroke-width="2.5" stroke-dasharray="1 3"/>
    <circle cx="150" cy="150" r="120" stroke="url(#goldCrest)" stroke-width="1.2"/>
    <circle cx="150" cy="150" r="100" stroke="url(#goldCrest)" stroke-width="1"/>

    <!-- Small ornamental dots around border -->
    <circle cx="150" cy="28" r="4" fill="url(#goldCrest)"/>
    <circle cx="150" cy="272" r="4" fill="url(#goldCrest)"/>
    <circle cx="28" cy="150" r="4" fill="url(#goldCrest)"/>
    <circle cx="272" cy="150" r="4" fill="url(#goldCrest)"/>

    <!-- Royal Crown at Top -->
    <path d="M 130 65 L 136 78 L 150 70 L 164 78 L 170 65 L 168 88 L 132 88 Z" fill="url(#goldCrest)"/>
    <circle cx="130" cy="62" r="2.5" fill="#ffffff"/>
    <circle cx="150" cy="67" r="3" fill="#ffffff"/>
    <circle cx="170" cy="62" r="2.5" fill="#ffffff"/>

    <!-- Monogram Typography: K & A -->
    <text x="110" y="165" font-family="'Cormorant Garamond', 'Cinzel', serif" font-size="54" font-weight="700" fill="url(#goldCrest)" text-anchor="middle">K</text>
    <text x="150" y="152" font-family="'Pinyon Script', cursive" font-size="34" font-style="italic" fill="url(#goldCrest)" text-anchor="middle">&amp;</text>
    <text x="190" y="165" font-family="'Cormorant Garamond', 'Cinzel', serif" font-size="54" font-weight="700" fill="url(#goldCrest)" text-anchor="middle">A</text>

    <!-- Subtitle Date -->
    <text x="150" y="195" font-family="'Bodoni Moda', 'Playfair Display', serif" font-size="12" letter-spacing="4" fill="url(#goldCrest)" text-anchor="middle">18 • 12 • 2026</text>

    <!-- Ribbon / Branch Flourish below -->
    <path d="M 100 215 C 130 225, 170 225, 200 215" stroke="url(#goldCrest)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="150" cy="222" r="3" fill="url(#goldCrest)"/>
  </g>
</svg>
