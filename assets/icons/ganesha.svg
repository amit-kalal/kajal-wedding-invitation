<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="goldGanesha" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF2B7"/>
      <stop offset="25%" stop-color="#D4AF37"/>
      <stop offset="60%" stop-color="#AA771C"/>
      <stop offset="85%" stop-color="#E6C875"/>
      <stop offset="100%" stop-color="#8A5A00"/>
    </linearGradient>
    <filter id="ganeshaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#b38032" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <g filter="url(#ganeshaGlow)" fill="url(#goldGanesha)">
    <!-- Crown / Mukut -->
    <path d="M100 15 L108 38 L122 30 L115 50 L135 52 L100 80 L65 52 L85 50 L78 30 L92 38 Z" stroke="#E6C875" stroke-width="1.5"/>
    <circle cx="100" cy="22" r="3.5" fill="#FFE599"/>
    
    <!-- Ears -->
    <!-- Right Ear (Viewer's right) -->
    <path d="M125 72 C155 60 178 78 172 108 C168 126 150 132 135 125 C142 110 138 88 125 72 Z" stroke="#D4AF37" stroke-width="1.5"/>
    <path d="M135 85 C150 82 160 92 158 108 C155 118 145 120 137 116" stroke="#AA771C" stroke-width="1" fill="none"/>
    
    <!-- Left Ear (Viewer's left) -->
    <path d="M75 72 C45 60 22 78 28 108 C32 126 50 132 65 125 C58 110 62 88 75 72 Z" stroke="#D4AF37" stroke-width="1.5"/>
    <path d="M65 85 C50 82 40 92 42 108 C45 118 55 120 63 116" stroke="#AA771C" stroke-width="1" fill="none"/>

    <!-- Head / Forehead -->
    <ellipse cx="100" cy="85" rx="28" ry="24"/>
    
    <!-- Sacred Tilak / Trishul mark -->
    <path d="M96 68 L100 60 L104 68 L104 82 L96 82 Z" fill="#990000"/>
    <circle cx="100" cy="74" r="2.5" fill="#FFE599"/>
    <line x1="91" y1="78" x2="109" y2="78" stroke="#FFE599" stroke-width="1.5"/>

    <!-- Trunk (S-Curve to left, Modak side) -->
    <path d="M94 92 C94 110 85 120 90 135 C95 148 112 152 115 138 C117 128 105 125 102 115 C100 105 106 95 106 92 Z"/>
    
    <!-- Modak / Laddu in Trunk tip -->
    <ellipse cx="118" cy="136" rx="7" ry="6" fill="#FFF275"/>
    <circle cx="118" cy="131" r="2" fill="#D4AF37"/>

    <!-- Tusk (Ekdanta) -->
    <path d="M86 102 L74 105 L85 108 Z" fill="#FFFFFF"/>
    
    <!-- Aura / Halo Arch -->
    <path d="M50 130 C45 80 70 42 100 42 C130 42 155 80 150 130" stroke="url(#goldGanesha)" stroke-width="2" stroke-dasharray="2 4" fill="none"/>
    
    <!-- Base Lotus / Floral Pedestal -->
    <path d="M60 175 C75 160 90 170 100 162 C110 170 125 160 140 175 C120 188 80 188 60 175 Z"/>
    <path d="M70 175 C85 168 100 170 100 170 C100 170 115 168 130 175 C115 184 85 184 70 175 Z" fill="#FFE599" opacity="0.6"/>
  </g>
</svg>
